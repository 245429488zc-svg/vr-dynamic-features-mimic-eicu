   <g id="text_2">
    <text style="font: 700 12px 'Times New Roman'; text-anchor: middle" x="143.91" y="42.068992" transform="rotate(-0 143.91 42.068992)">MIMIC-IV</text>
   </g>
   <g id="text_3">
    <text style="font: 8.8px 'Times New Roman'" transform="translate(76.571438 77.254522)">Adult first ICU stays from MIMIC-IV</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(124.198688 86.180472)">(n=85,242)</text>
   </g>
   <g id="text_4">
    <text style="font: 7.8px 'Times New Roman'" transform="translate(272.02275 73.565625)">Excluded from total ICU stays (n=94,458):</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(289.166906 81.477263)">non-adult or non-first ICU stays</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(323.688609 89.3889)">(n=9,216)</text>
   </g>
   <g id="text_5">
    <text style="font: 8.8px 'Times New Roman'" transform="translate(77.566938 143.594267)">Early invasive mechanical ventilation</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(87.083313 152.520217)">within 24 h after ICU admission</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(124.198688 161.429667)">(n=28,387)</text>
   </g>
   <g id="text_6">
    <text style="font: 7.8px 'Times New Roman'" transform="translate(277.050094 140.418901)">Excluded: no early invasive mechanical</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(322.530188 148.330539)">ventilation</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(288.840891 156.227551)">within 24 h after ICU admission</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(321.738609 164.124564)">(n=56,855)</text>
   </g>
   <g id="text_7">
    <text style="font: 8.8px 'Times New Roman'" transform="translate(63.990875 214.396986)">At least 3 valid paired P/F-VR measurements</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(84.277625 223.306436)">within the truncated 48-h window</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(124.198688 232.215886)">(n=12,694)</text>
   </g>
   <g id="text_8">
    <text style="font: 7.8px 'Times New Roman'" transform="translate(274.661344 207.257552)">Excluded: fewer than 3 valid pairs within</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(334.445297 215.154565)">the</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(279.090891 223.051577)">window; 569 stays lost eligibility after</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(293.828625 230.963215)">window-boundary truncation</text>
    <text style="font: 7.8px 'Times New Roman'" transform="translate(321.738609 238.874852)">(n=15,693)</text>
   </g>
   <g id="text_9">
    <text style="font: 8.8px 'Times New Roman'" transform="translate(86.427438 285.183206)">Final MIMIC-IV analysis cohort</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(63.950313 294.109156)">(vital status from official admissions records)</text>
    <text style="font: 8.8px 'Times New Roman'" transform="translate(98.253813 303.018606)">(n=12,694; deaths=2,514)</text>
   </g>
   <g id="text_10">
